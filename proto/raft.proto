syntax = "proto3";

service RaftNode {
  rpc RequestVote(MsgVoteRequest) returns (MsgVoteResponse) {}
  rpc AppendEntries(MsgAppendEntriesRequest) returns (MsgAppendEntriesResponse) {}
  rpc SubmitCommand(ClientCommandRequest) returns (ClientCommandResponse) {}
}

message MsgVoteRequest {
  uint32 term = 1;
  string candidateId = 2;
  int32 lastLogIndex = 3;
  uint32 lastLogTerm = 5;
}

message MsgVoteResponse {
  uint32 term = 1;
  bool voteGranted = 2;
}

message Entry {
  uint32 term = 1;
  string op = 2;
  string data = 3;
}

message MsgAppendEntriesRequest {
  uint32 term = 1;
  string leaderId = 2;
  int32 prevLogIndex = 3;
  uint32 prevLogTerm = 4;
  int32 leaderCommit = 5;
  repeated Entry entries = 6;
}

message MsgAppendEntriesResponse {
  uint32 term = 1;
  bool success = 2;
}

message ClientCommandRequest {
  string op = 1;
  string data = 2;
}

message ClientCommandResponse {
  bool success = 1;
  string leaderId = 2;
  string value = 3;
}